<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img">
  <title>Wavy Suite</title>
  <!-- Transparent background; dark lettering for light pages (wavy-banner-dark.svg is the dark-page twin) -->
  <defs>
    <linearGradient id="wg" x1="28" y1="0" x2="172" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40d6f0"/><stop offset="1" stop-color="#ffaa1e"/>
    </linearGradient>
  </defs>
  <g transform="translate(90 70) scale(1.1)">
    <rect width="200" height="200" rx="44" fill="#04121f" stroke="#1d3a52" stroke-width="3"/>
    <g fill="none" stroke="url(#wg)" stroke-linecap="round" stroke-width="12">
      <path d="M20 0 C38 -22,60 -22,78 0 S118 22,136 0" transform="translate(8 54)"/>
      <path d="M20 0 C38 -22,60 -22,78 0 S118 22,136 0" transform="translate(22 100)" opacity=".6"/>
      <path d="M20 0 C38 -22,60 -22,78 0 S118 22,136 0" transform="translate(36 146)" opacity=".3"/>
    </g>
  </g>
  <text x="370" y="190" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="108" font-weight="700" fill="#061b2e" letter-spacing="6">WAVY</text>
  <text x="372" y="248" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#c27400" letter-spacing="22">SUITE</text>
  <text x="372" y="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#3d5a72">Open-source VST3 · CLAP · AU effects. Modelled, measured, mixed.</text>
</svg>
